<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tôle Froissée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: plein écran — vue 3D derrière, garage en panneau (bas en portrait, droite en paysage), HUD de conduite par-dessus */
:root{
  --bg:#0f1115; --panel:rgba(16,18,23,.94); --panel2:#1a1d24; --fg:#eef0f3; --mute:#8d95a3;
  --line:rgba(255,255,255,.09); --accent:#ff5b1f; --accent2:#ffb347; --ok:#3ecf8e;
  --display:'Chakra Petch',ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* ---------- GARAGE ---------- */
#menu{position:fixed;inset:0;pointer-events:none}
#mhead{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:16px;pointer-events:none}
.logo{font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:18px;height:10px;background:var(--accent);clip-path:polygon(0 100%,18% 0,48% 60%,70% 10%,100% 100%)}
#mBrand{margin-top:14px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2)}
#mName{font-size:clamp(26px,7vw,44px);font-weight:700;line-height:1.02;text-wrap:balance}
#mSpecs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#mSpecs span{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#mFoot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:calc(46% + 12px);display:flex;align-items:center;gap:10px;pointer-events:none}
#mHint{font-size:12px;color:var(--mute);flex:1;min-width:0}
#mDmg{font-size:12px;color:var(--accent2);font-variant-numeric:tabular-nums}
.ghost{pointer-events:auto;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;letter-spacing:.08em}
#panel{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--panel);border-top:1px solid var(--line);
  display:flex;flex-direction:column;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#brandBar{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;touch-action:pan-x;scrollbar-width:none;flex:none}
#brandBar::-webkit-scrollbar{display:none}
#brandBar button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
#brandBar button.on{border-color:var(--accent);color:var(--accent2)}
#list{flex:1;overflow-y:auto;touch-action:pan-y;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
#list section{padding-top:6px}
#list h3{position:sticky;top:0;margin:0;padding:8px 0 6px;background:linear-gradient(var(--panel) 75%,transparent);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;z-index:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.card .sw{flex:none;width:14px;height:28px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.card b{display:block;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{display:block;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.card div{min-width:0}
.card.on{border-color:var(--accent);background:#2a1d17}
#go{flex:none;margin:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));
  background:var(--accent);border:0;border-radius:8px;padding:14px;font-size:17px;font-weight:700;letter-spacing:.2em;color:#160800}
#go:active{transform:translateY(1px);filter:brightness(.95)}
#tabs{display:flex;gap:4px;padding:10px max(16px,env(safe-area-inset-left,0px)) 0;flex:none}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--mute)}
#tabs button.on{color:var(--fg);border-color:var(--accent)}
#custom{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.opt h4{margin:0 0 7px;font-size:11px;letter-spacing:.2em;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.opt h4 b{color:var(--fg);font-weight:600;letter-spacing:.05em}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0}
.sws button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.sws label{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mute);position:relative;overflow:hidden;cursor:pointer}
.sws input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 6px;font-size:12px;font-weight:600}
.seg button.on{border-color:var(--accent);color:var(--accent2);background:#2a1d17}
#cReset{align-self:flex-start}
#dead{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:3;text-align:center;pointer-events:auto;background:rgba(10,11,14,.78);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:calc(100% - 32px)}
#dead b{display:block;font-size:clamp(22px,6vw,32px);letter-spacing:.12em;color:var(--accent)}
#dead p{margin:6px 0 14px;color:var(--mute);font-size:13px}
#dead button{background:var(--accent);border:0;border-radius:8px;padding:12px 18px;font-weight:700;letter-spacing:.14em;color:#160800;font-size:14px}
@media (orientation:landscape){
  #panel{left:auto;top:0;width:min(42%,440px);height:auto;border-top:0;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  #mFoot{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:calc(min(42%,440px) + 16px)}
  #mhead{right:calc(min(42%,440px) + 16px)}
}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#hud button{pointer-events:auto;background:rgba(10,11,14,.6);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:12px;font-weight:700;letter-spacing:.08em}
#hud .sp{flex:1}
#speedo{text-align:center;padding:2px 12px;background:rgba(10,11,14,.55);border:1px solid var(--line);border-radius:8px;min-width:96px}
#spd{display:block;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#speedo small{font-size:10px;color:var(--mute);letter-spacing:.15em}
#dmg{background:rgba(10,11,14,.55);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:110px}
#dmg small{font-size:10px;letter-spacing:.15em;color:var(--mute);display:flex;justify-content:space-between}
#dmg small b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent2) 50%,var(--accent));transition:width .2s}
#kbd{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--mute);background:rgba(10,11,14,.55);padding:8px 10px;border-radius:6px;pointer-events:none}

/* ---------- COMMANDES TACTILES ---------- */
#ctl{position:fixed;left:0;right:0;bottom:0;height:46%;pointer-events:auto;touch-action:none}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.08em;
  background:rgba(14,15,19,.42);border:1.5px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);transition:background .06s}
.btn.on{background:rgba(255,91,31,.55);border-color:var(--accent2)}
.btn svg{width:42%;height:42%;fill:currentColor}
.st{width:min(23vw,104px);height:min(23vw,104px);border-radius:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#bL{left:max(14px,env(safe-area-inset-left,0px))}
#bR{left:calc(max(14px,env(safe-area-inset-left,0px)) + min(23vw,104px) + 12px)}
.ped{width:min(19vw,86px);height:min(30vw,140px);border-radius:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:12px}
#bG{right:max(14px,env(safe-area-inset-right,0px))}
#bB{right:calc(max(14px,env(safe-area-inset-right,0px)) + min(19vw,86px) + 10px);height:min(22vw,100px)}
#bH{right:calc(max(14px,env(safe-area-inset-right,0px)) + min(19vw,86px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px + min(22vw,100px) + 10px);
  width:min(19vw,86px);height:44px;border-radius:10px;font-size:10px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(20px,6vw,34px);font-weight:700;letter-spacing:.1em;color:var(--accent2);
  text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:14px;letter-spacing:.2em;color:var(--mute);z-index:9}
@media (prefers-reduced-motion:reduce){.bar i,#toast{transition:none}}
</style>
</head>

  <button id="hCam">CAMÉRA</button>

</div>
<div id="ctl" hidden>

  <div class="btn st" id="bR" data-k="right"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></div>

const K={chrome:'#d5d8dd',lens:'#f3f0e2',dark:'#141517',red:'#c3121a',amber:'#e48a12',white:'#f1f1ef',blue:'#1f4bb8',
  glass:'#18222b',glassTop:'#2a3945',arch:'#0c0c0d',interior:'#2a2522',bed:'#242424',under:'#101010',tire:'#161616',rimDark:'#2e3034'};

function makeShape(sp){
  const L=sp.L,W=sp.W,ws=sp.ws,rw=sp.rw,dh=sp.hood-sp.hoodF;
  const pts=[[0,sp.hoodF],[ws*.12,sp.hoodF+dh*.45],[ws*.32,sp.hoodF+dh*.78],[ws,sp.hood]];
  if(rw-ws>.06)pts.push([(ws+rw)/2,sp.belt]);
  pts.push([rw,sp.trunk]);
  if(rw<.93)pts.push([.955,sp.trunk-(sp.trunk-sp.tail)*.35]);
  pts.push([1,sp.tail]);
  const P=[];for(const q of pts)if(!P.length||q[0]>P[P.length-1][0]+1e-4)P.push(q);
  const top=s=>{if(s<=0)return P[0][1];for(let i=1;i<P.length;i++)if(s<=P[i][0]){const t=(s-P[i-1][0])/(P[i][0]-P[i-1][0]);return P[i-1][1]+(P[i][1]-P[i-1][1])*t}return P[P.length-1][1]};
  const fo=sp.fo??(L-sp.wb)/2, axF=L/2-fo, axR=axF-sp.wb;
  const bottom=s=>sp.clr+.07*Math.max(0,1-s/.07)**2+.07*Math.max(0,(s-.93)/.07)**2;
  const hwBase=(s,fy)=>{const e=s<.14?1-s/.14:s>.86?(s-.86)/.14:0;let hw=W/2*(1-sp.round*e*e);
    if(fy>.7)hw*=1-.06*((fy-.7)/.3)**2; if(fy<.2)hw*=1-.035*(.2-fy)/.2; return hw};
  const flareAt=(z,fy)=>{if(!sp.flare||fy>.9)return 0;let f=0;for(const az of [axF,axR]){const d=Math.abs(z-az)/(sp.wr*2);if(d<1)f=Math.max(f,sp.flare*(.5+.5*Math.cos(d*Math.PI)))}return f};
  const zAt=(s,fy)=>{let z=L/2-s*L;if(s<.1)z-=fy*sp.nose*(1-s/.1);if(s>.9)z+=fy*sp.tailSlope*((s-.9)/.1);return z};
  const roof=sG=>{const H=sp.H;
    if(sG<=sp.roofF){const t=clamp((sG-ws)/Math.max(1e-3,sp.roofF-ws),0,1),y0=top(ws);return y0+(H-y0)*(1-(1-t)**1.8)}
    if(sG<=sp.roofR)return H;
    const t=clamp((sG-sp.roofR)/Math.max(1e-3,rw-sp.roofR),0,1),y1=top(rw);return H-(H-y1)*t**1.6};
  return {top,bottom,hwBase,flareAt,zAt,roof,axF,axR};
}

// Boîte subdivisée remodelée : mapFn(fx,fy,u,out) → position, colorFn(face,fx,fy,u,x,y,z) → {c,g}
function boxPart(sx,sy,sz,mapFn,colorFn){
  const g=new THREE.BoxGeometry(1,1,1,sx,sy,sz);
  const p=g.attributes.position.array,n=p.length/3,out=new Float32Array(p.length),v={x:0,y:0,z:0};
  for(let i=0;i<n;i++){mapFn(p[3*i]+.5,p[3*i+1]+.5,.5-p[3*i+2],v);out[3*i]=v.x;out[3*i+1]=v.y;out[3*i+2]=v.z}
  const idx=g.index.array,nt=idx.length/3,tc=new Float32Array(nt*3),glass=new Uint8Array(nt);
  g.groups.forEach((gr,face)=>{for(let t=gr.start/3;t<(gr.start+gr.count)/3;t++){
    const a=idx[3*t],b=idx[3*t+1],c=idx[3*t+2];
    const fx=(p[3*a]+p[3*b]+p[3*c])/3+.5, fy=(p[3*a+1]+p[3*b+1]+p[3*c+1])/3+.5, u=.5-(p[3*a+2]+p[3*b+2]+p[3*c+2])/3;
    const r=colorFn(face,fx,fy,u,(out[3*a]+out[3*b]+out[3*c])/3,(out[3*a+1]+out[3*b+1]+out[3*c+1])/3,(out[3*a+2]+out[3*b+2]+out[3*c+2])/3);
    tc[3*t]=r.c[0];tc[3*t+1]=r.c[1];tc[3*t+2]=r.c[2];glass[t]=r.g?1:0}});
  const res={pos:out,idx:Uint32Array.from(idx),tc,glass};g.dispose();return res;
}
const mul=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];

function buildBodyParts(sp,S){
  const GL=rgb(sp.tint===1?'#06080b':sp.tint===2?'#5a6672':K.glass),GT=rgb(sp.tint===1?'#0a0d11':sp.tint===2?'#8794a0':K.glassTop);
  const C1=rgb(sp.color),C2=sp.color2?rgb(sp.color2):C1,ST=sp.stripe?rgb(sp.stripe):null;
  // --- caisse basse
  const SX=12,SY=7,SZ=30;
  const lower=boxPart(SX,SY,SZ,(fx,fy,s,v)=>{
    const z=S.zAt(s,fy),b=S.bottom(s),t=S.top(s),y=b+fy*(t-b);
    const hw=S.hwBase(s,fy)+S.flareAt(z,fy);let x=(fx-.5)*2*hw;
    v.x=x;v.y=y;v.z=z;
  },(face,fx,fy,s,x,y,z)=>{
    let c=C1;
    if(sp.color2){const sc=face<=1?(Math.floor(s*SZ)+.5)/SZ:s,rc=face<=1?(Math.floor(fy*SY)+.5)/SY:fy,yq=S.bottom(sc)+rc*(S.top(sc)-S.bottom(sc));if((face<=1?yq:y)<sp.twoY)c=C2}
    if(face===3)return{c:rgb(K.under)};
    if(face<=1&&fy<.1)c=mul(c,.72);
    if(face===2){
      if(sp.pickup&&s>sp.rw+.015&&s<.975&&Math.abs(fx-.5)<.42)return{c:rgb(K.bed)};
      if(sp.open&&s>sp.roofF+.02&&s<sp.roofF+.24&&Math.abs(fx-.5)<.4)return{c:rgb(K.interior)};
      if(ST&&Math.abs(x)>.09&&Math.abs(x)<.23)c=ST;
    }
    return{c};
  });
  // --- habitacle (vitres + toit)
  const GX=8,GY=5,GZ=18,NA=4,NR=4,ua=NA/GZ,ub=(GZ-NR)/GZ;
  const mapU=u=>u<=ua?sp.ws+u/ua*(sp.roofF-sp.ws):u<=ub?sp.roofF+(u-ua)/(ub-ua)*(sp.roofR-sp.roofF):sp.roofR+(u-ub)/(1-ub)*(sp.rw-sp.roofR);
  const kB=(sp.roofR-sp.roofF>.12)?NA+Math.floor((GZ-NA-NR)*.45):-1, sedan=(sp.rw-sp.roofR)>.06;
  const green=boxPart(GX,GY,GZ,(fx,fy,u,v)=>{
    const sG=mapU(u),b=S.top(sG)-.015;
    const cam=.03*(1-(2*fx-1)**2)*Math.min(1,u*8,(1-u)*8)*(fy>.999?1:0);
    const r=Math.max(b,S.roof(sG))+cam;
    const hwB=S.hwBase(sG,1)*.99,hw=hwB*(1-(1-sp.tumble)*fy);
    v.x=(fx-.5)*2*hw;v.y=b+fy*(r-b);v.z=sp.L/2-sG*sp.L;
  },(face,fx,fy,u)=>{
    const col=Math.min(GZ-1,Math.floor(u*GZ)),cx=Math.floor(fx*GX),edge=cx===0||cx===GX-1;
    const body=sp.roofColor?rgb(sp.roofColor):C1;
    if(face===2){
      if(col<NA)return edge?{c:body}:{c:GT,g:1};
      if(col>=GZ-NR){if(sp.open)return{c:rgb(K.interior)};return edge?{c:body}:{c:GT,g:1}}
      return{c:body};
    }
    if(face<=1){
      if(sp.open)return{c:GL,g:1};
      const row=Math.floor(fy*GY);
      if(row>=GY-1||col===0||col===kB)return{c:body};
      if(col>=GZ-NR&&(sedan||col===GZ-1))return{c:body};
      return{c:GL,g:1};
    }
    return{c:body};
  });
  return [lower,green];
}

function mergeParts(parts){
  let nv=0,ni=0;for(const p of parts){nv+=p.pos.length;ni+=p.idx.length}
  const P=new Float32Array(nv),I=new Uint32Array(ni),tc=new Float32Array(ni),gl=new Uint8Array(ni/3);
  let ov=0,oi=0;
  for(const p of parts){P.set(p.pos,ov);const base=ov/3;for(let i=0;i<p.idx.length;i++)I[oi+i]=p.idx[i]+base;
    tc.set(p.tc,oi);gl.set(p.glass,oi/3);ov+=p.pos.length;oi+=p.idx.length}
  return{P,I,tc,gl};
}

// Maillage « net » : couleurs par triangle, normales lissées, rayures & bris de glace selon la déformation
class Crisp{
  constructor(parts,mat){
    const m=mergeParts(parts);Object.assign(this,m);this.O=m.P.slice();this.n=m.P.length/3;
    this.src=new THREE.BufferGeometry();this.src.setAttribute('position',new THREE.BufferAttribute(this.P,3));this.src.setIndex(new THREE.BufferAttribute(this.I,1));
    const nt=this.I.length/3;this.geo=new THREE.BufferGeometry();
    this.geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nt*9),3));
    this.geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nt*9),3));
    this.geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(nt*9),3));
    this.mesh=new THREE.Mesh(this.geo,mat);this.rebuild();this.geo.computeBoundingSphere();this.geo.boundingSphere.radius*=1.15;

    const pos=this.geo.attributes.position.array,nor=this.geo.attributes.normal.array,col=this.geo.attributes.color.array;
    const nt=I.length/3;
    for(let t=0;t<nt;t++){
      let dmax=0;
      for(let k=0;k<3;k++){const si=I[3*t+k]*3,o=9*t+3*k;
        pos[o]=P[si];pos[o+1]=P[si+1];pos[o+2]=P[si+2];nor[o]=N[si];nor[o+1]=N[si+1];nor[o+2]=N[si+2];
        const dx=P[si]-O[si],dy=P[si+1]-O[si+1],dz=P[si+2]-O[si+2],d=dx*dx+dy*dy+dz*dz;if(d>dmax)dmax=d}

let shake=0;const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),_t=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  showCam.aspect=w/h;const land=w>h;
  if(land)showCam.setViewOffset(w,h,Math.min(w*.42,440)/2,-h*.02,w,h);else showCam.setViewOffset(w,h,0,h*.2,w,h);
  showCam.fov=land?30:44;showCam.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0}
  if(state==='menu'){
    showIdle+=dt;if(showIdle>2.5&&!drag)showYaw+=dt*.25;
    if(showCar){showCar.a=showYaw;const sp=showCar.sp,land=innerWidth>innerHeight;
      const hf=2*Math.atan(Math.tan(showCam.fov*Math.PI/360)*(land?Math.max(1,showCam.aspect*.58):showCam.aspect));
      const d=Math.max(sp.L*.6/Math.tan(hf/2),sp.H*1.1/Math.tan(showCam.fov*Math.PI/360*(land?1:.55)))+sp.L*.35;
      showCam.position.set(d*.62,sp.H*1.15+.9,d*.78);showCam.lookAt(0,sp.H*.42+showCar.group.position.y*.75,0)}
    if(showCar)showCar.sync(dt);fxShow.update(dt);updShowDmg();
    renderer.render(show,showCam);return;
  }
  readInput();if(player.dead){inp.gas=inp.brake=inp.steer=0}
  const sub=3,h=dt/sub;for(let i=0;i<sub;i++)physics(h,inp);
  for(const c of cars)c.sync(dt);
  updSparks(dt);fxGame.update(dt);respawnWrecks(dt);
  for(const c of cars)if(!c.parked&&Math.abs(c.x-player.x)<120&&Math.abs(c.z-player.z)<120)skid(c,dt);
  // caméra
  const p=player,s=Math.sin(p.a),co=Math.cos(p.a);
  let back=7.2,up=2.7,look=1.1,ahead=3;const jy=p.dead?p.group.position.y:0;
  if(camMode===1){back=12;up=4.6;look=1}
  if(camMode===2){back=-.3;up=p.sp.H*.92;look=p.sp.H*.85;ahead=10}
  if(camMode===3){back=.01;up=26;look=0;ahead=0}
  _t.set(p.x-s*back*(p.dead?1.8:1),up+jy*.6+(p.dead?2:0),p.z-co*back*(p.dead?1.8:1));
  if(camMode===2||camMode===3)camPos.copy(_t);else camPos.lerp(_t,Math.min(1,dt*(4+Math.abs(p.vF)*.08)));
  camLook.set(p.x+s*ahead,look+jy*1.05,p.z+co*ahead);
  camera.position.copy(camPos);
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake*.5;camera.position.y+=(Math.random()-.5)*shake*.35;shake=Math.max(0,shake-dt*2.2)}
  if(camMode===3)camera.up.set(s,0,co);else camera.up.set(0,1,0);
  camera.lookAt(camLook);
  camera.fov=60+Math.min(14,Math.abs(p.vF)*.22);camera.updateProjectionMatrix();
  // HUD
  $('#spd').textContent=Math.round(Math.abs(p.vF)*3.6);
  const dmg=Math.round(p.damage);$('#dmgTxt').textContent=dmg+'%';$('#dmgBar').style.width=dmg+'%';
  if(p.dead&&p.deadT>2.3){if($('#dead').hidden)$('#dead').hidden=false;const left=Math.ceil(RESPAWN_DELAY-p.deadT);$('#dTxt').textContent=left>1?`Nouvelle voiture dans ${left} s`:'Nouvelle voiture dans 1 s';
    if(p.deadT>=RESPAWN_DELAY)respawnPlayer()}
  $('#dmgTxt').style.color=dmg>=75?'var(--accent)':'';
  engineSound(p,inp.gas?1:0,!muted&&!p.dead);
  sky.position.copy(camera.position);
  sun.target.position.set(p.x,0,p.z);sun.position.set(p.x+60,120,p.z+35);
  renderer.render(game,camera);
}

/* démarrage */
buildMenu();resize();selectCar(selected);
requestAnimationFrame(()=>{const sec=document.getElementById('b-'+slug(selected.brand)),list=$('#list');if(sec)list.scrollTop=sec.offsetTop-list.offsetTop;});
$('#loading').hidden=true;
requestAnimationFrame(frame);
</script>
</body>
</html>
