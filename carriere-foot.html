<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Carrière Pro — Simulateur de footballeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0a2e1c;
    --pitch:#0f3d24;
    --pitch-light:#155230;
    --chalk:#f4f2ea;
    --chalk-dim:#c9c9be;
    --gold:#d4af37;
    --gold-bright:#f0c860;
    --red:#c1272d;
    --line: rgba(244,242,234,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Work Sans', sans-serif;
    background:
      repeating-linear-gradient(90deg, var(--pitch) 0px, var(--pitch) 40px, var(--pitch-light) 40px, var(--pitch-light) 80px),

    color:var(--chalk);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 90px;
  }
  .halo{
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0) 0%, rgba(10,46,28,0.55) 75%);
    z-index:0;
  }
  #app{ width:100%; max-width:640px; position:relative; z-index:1; }
  h1,h2,h3{ font-family:'Anton', sans-serif; letter-spacing:0.5px; font-weight:400; }
  .eyebrow{
    font-family:'Space Mono', monospace;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:11px;
    color:var(--gold-bright);
    margin-bottom:6px;
  }
  .title-main{
    font-size:44px;
    line-height:1.02;
    color:var(--chalk);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .title-main span{ color:var(--gold-bright); }
  .subtitle{ color:var(--chalk-dim); margin-top:10px; font-size:15px; line-height:1.5; }

  .card{
    background: rgba(244,242,234,0.05);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-top:20px;
    backdrop-filter: blur(2px);
  }

  .grid-countries{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-top:14px;
  }
  @media(min-width:480px){ .grid-countries{ grid-template-columns: repeat(3, 1fr); } }

    background: rgba(244,242,234,0.04);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:12px 10px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    font-family:'Work Sans';
    font-size:14px;
    font-weight:600;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .country-btn .flagline{
    display:block; font-family:'Space Mono'; font-size:10px; color:var(--chalk-dim);
    text-transform:uppercase; letter-spacing:1px; margin-top:3px;
  }
  .country-btn:hover{ border-color:var(--gold); background: rgba(212,175,55,0.08); transform:translateY(-1px); }
  .country-btn.selected{ border-color:var(--gold-bright); background: rgba(212,175,55,0.16); }

  .pos-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
  @media(min-width:480px){ .pos-grid{ grid-template-columns:repeat(4,1fr); } }
  .pos-btn{
    background: rgba(244,242,234,0.04);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:16px 8px;
    border-radius:10px;
    text-align:center;

  .pos-btn small{ display:block; font-family:'Space Mono'; font-size:10px; color:var(--chalk-dim); margin-top:4px; font-weight:400; }
  .pos-btn:hover{ border-color:var(--gold); }
  .pos-btn.selected{ border-color:var(--gold-bright); background: rgba(212,175,55,0.16); }

  .ticker-track{
    display:inline-block; white-space:nowrap; padding-left:100%;

    font-family:'Space Mono'; font-size:12px; color:var(--chalk-dim);

  .ticker-track span{ color:var(--gold-bright); font-weight:700; }
  @keyframes scroll-left{ from{ transform:translateX(0);} to{ transform:translateX(-100%);} }
  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; padding-left:120px; } }

  .divider{ height:1px; background:var(--line); margin:18px 0; }
  .muted{ color:var(--chalk-dim); font-size:13px; line-height:1.5; }
  .final-hero{ text-align:center; padding:10px 0 4px; }

  .trophy-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .trophy-chip{

  a, a:visited{ color: var(--gold-bright); }
  ::selection{ background: var(--gold); color:#1a1305; }
</style>

/* Compétitions internationales par confédération (hors Coupe du Monde, ouverte à tous) */
const CONTINENTAL_CUP = {
  "Europe":"Euro",
  "Amérique":"Copa América",
  "Afrique":"CAN",
  "Asie":"Coupe d'Asie"
};
const NATIONAL_TEAMS = COUNTRIES.map(c => ({ name:c.name, tier:c.ntTier, continent:c.continent, flag:c.flag }));
function flagOf(countryName){
  const c = COUNTRIES.find(x=>x.name===countryName);
  return c ? c.flag+" " : "";
}

const POSITIONS = [
  { code:"GB", label:"Gardien" },
  { code:"DEF", label:"Défenseur" },
  { code:"MIL", label:"Milieu" },
  { code:"ATT", label:"Attaquant" }
];

const FIRST_NAMES = ["Lucas","Noah","Théo","Enzo","Rayan","Yanis","Mattéo","Diego","Kylian","Idris","Bilal","Amir","Léo","Nathan","Ilyes"];

/* ============================= ÉTAT ============================= */
let state = null;

function newState(){
  return {
    screen:"setup",
    step:1,
    name:"",
    ageChoice:17,
    countryIdx:null,
    posIdx:null,
    player:null,
    lastReport:null,
    pendingOffers:[],
    news:[]
  };
}
state = newState();

/* ============================= UTILITAIRES ============================= */
function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
function euros(v){ return Math.round(v).toLocaleString('fr-FR') + " €"; }
function weightedClub(clubs, favorLow){
  // favorLow: true privilégie les petits clubs (tier faible)
  const weights = clubs.map(c => favorLow ? (6 - c.tier) : c.tier);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = rand(0,total);
  for(let i=0;i<clubs.length;i++){
    r -= weights[i];
    if(r<=0) return clubs[i];
  }
  return clubs[clubs.length-1];
}
function stars(tier){ return "★".repeat(tier) + "☆".repeat(5-tier); }
function computeGlobalSum(p){
  return (p.totalEarnings||0) + (p.totalTransferFees||0) + (p.coach ? (p.coach.totalEarnings||0) : 0);
}

/* ============================= LOGIQUE CARRIÈRE ============================= */
function computeWage(rating, tier, isYouth){
  const eliteMult = rating>=97 ? 2.6 : rating>=93 ? 2.1 : rating>=88 ? 1.6 : rating>=82 ? 1.25 : rating>=75 ? 1 : 0.8;
  const base = (Math.pow(rating,3)/9000) * (0.55 + tier*0.38) * 12000 * eliteMult;
  let wage = base * rand(0.82,1.25);
  if(isYouth) wage *= rand(0.35,0.55); // contrat rookie : salaire réduit malgré le potentiel affiché
  return Math.round(wage);
}
function computeTransferFee(rating, buyerTier){
  const base = (Math.pow(rating,3)/1000) * buyerTier * 15000;
  // Au-delà de 90 de note, les grosses écuries sont prêtes à casser leur tirelire
  const eliteMult = rating>=97 ? 4.5 : rating>=93 ? 3.2 : rating>=90 ? 2.2 : rating>=85 ? 1.4 : 1;
  return Math.round(base * eliteMult * rand(0.65,1.5));
}

/* Simule un tournoi international (Coupe du Monde / Euro / Copa América / CAN / Coupe d'Asie)
   pour une sélection de force "strength" (1-6). Retourne le tour atteint + si champion. */
function simulateTournament(strength){
  const rounds = ["Phase de groupes","Huitièmes de finale","Quarts de finale","Demi-finales","Finaliste","Champion"];
  const weights = rounds.map((_, i) => Math.max(0.4, strength - i*0.85 + rand(-0.6,0.6)));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = rand(0,total), idx = 0;
  for(let i=0;i<weights.length;i++){ r -= weights[i]; if(r<=0){ idx = i; break; } }
  return { round: rounds[idx], champion: idx === rounds.length-1 };
}

/* Retourne le nom + le type ("world"/"continental") du tournoi de l'année, sinon null */
function tournamentOfYear(year, continent){
  if(year % 4 === 0) return { name:`Coupe du Monde ${year}`, type:"world" };
  if(year % 4 === 2) return { name:`${CONTINENTAL_CUP[continent] || "Tournoi continental"} ${year}`, type:"continental" };
  return null;
}

/* Simule la saison en sélection nationale d'un joueur (ou renvoie null si non sélectionné) */
function simulateNationalTeamSeason(p){
  const callUpChance = clamp((p.rating-55)/55, 0.04, 0.95);
  if(Math.random() >= callUpChance) return { selected:false };

  const caps = randInt(2,8);
  let goals = 0;
  if(p.position === "Attaquant") goals = Math.round(caps * rand(0.25,0.6) * (p.rating/85));
  else if(p.position === "Milieu") goals = Math.round(caps * rand(0.05,0.2) * (p.rating/85));
  else if(p.position === "Défenseur") goals = Math.round(caps * rand(0.01,0.06));
  p.nat.caps += caps;
  p.nat.goals += goals;
  p.nat.selected = true;

  const country = COUNTRIES.find(c=>c.name===p.country);
  const tournament = tournamentOfYear(p.year, country.continent);
  let tournamentResult = null;
  if(tournament){
    const strength = country.ntTier + (p.rating>=85?1.5:p.rating>=75?0.8:0);
    const result = simulateTournament(strength);
    const tGoals = p.position==="Attaquant" ? randInt(0,5) : p.position==="Milieu" ? randInt(0,3) : randInt(0,1);
    p.nat.goals += tGoals;
    tournamentResult = { name: tournament.name, round: result.round, champion: result.champion, goals: tGoals };
    if(result.champion){
      p.trophies.push(`${tournament.name} — Champion avec ${p.country} 🌍`);
    }
  }
  return { selected:true, caps, goals, tournament: tournamentResult };
}

function estimateStartingRating(age){
  // La note globale démarre autour de 75, avec une légère variation selon l'âge de départ
  let base = 75;
  if(age <= 19) base -= (20-age)*1.8;
  else if(age >= 33) base -= (age-32)*1.8;
  return clamp(Math.round(base + rand(-5,5)), 55, 88);
}

function startCareer(){
  const country = COUNTRIES[state.countryIdx];
  const pos = POSITIONS[state.posIdx];
  const age = clamp(parseInt(state.ageChoice) || 17, 16, 43);
  const rating = estimateStartingRating(age);
  const potentialRoom = age <= 20 ? randInt(10,24) : age <= 27 ? randInt(4,14) : age <= 33 ? randInt(0,6) : 0;
  const potential = clamp(rating + potentialRoom, rating, 99);
  const isYouth = age <= 19;
  // Les joueurs plus cotés visent des clubs plus huppés dès le départ
  const targetTierBias = clamp(Math.round(rating/20), 1, 5);
  const weighted = country.clubs.map(c=>({c, w: 6 - Math.abs(c.tier - targetTierBias)}));
  const totalW = weighted.reduce((a,b)=>a+b.w,0);
  let r = rand(0,totalW), club = weighted[0].c;
  for(const item of weighted){ r -= item.w; if(r<=0){ club = item.c; break; } }
  const wage = computeWage(rating, club.tier, isYouth);

  state.player = {
    name: state.name.trim() || pick(FIRST_NAMES),
    country: country.name,
    position: pos.label,
    age,
    startAge: age,
    rating, potential, peakRating: rating,
    club: { name: club.name, tier: club.tier, country: country.name },
    wage,
    seasonsPlayed: 0,
    totalGoals:0, totalAssists:0, totalApps:0,
    totalEarnings:0, totalTransferFees:0, totalEventBonus:0,
    trophies:[],
    clubHistory:[{ club: club.name, country: country.name, fromAge:age, toAge:null }],
    retired:false,
    year: 2026,
    nat: { selected:false, caps:0, goals:0 },
    coach: null
  };
  state.news.unshift(`${state.player.name} signe son premier contrat pro avec ${club.name} ${stars(club.tier)}`);
  state.screen = "career";
  state.lastReport = null;
  state.pendingOffers = [];
  render();
}

/* Petits événements aléatoires de saison, purement narratifs avec un léger effet sur la note ou le salaire */
const RANDOM_EVENTS = [
  { text:"Un but exceptionnel entre dans le top 10 de la saison en Europe.", ratingDelta:1 },
  { text:"Une publicité internationale fait exploser sa notoriété.", wageBonusPct:0.10 },
  { text:"Un carton rouge controversé lui vaut trois matchs de suspension.", ratingDelta:-2 },
  { text:"Il est élu Joueur du mois par les supporters du club.", ratingDelta:1 },
  { text:"Une gêne physique persistante ternit sa fin de saison.", ratingDelta:-2 },
  { text:"Un sponsor personnel lui offre un contrat en or.", wageBonusPct:0.18 },
  { text:"Une polémique médiatique agite le vestiaire.", ratingDelta:-1 },
  { text:"Il devient une figure de vestiaire et inspire les jeunes du club.", ratingDelta:1 },
  { text:"Un accrochage à l'entraînement l'écarte quelques semaines.", ratingDelta:-1 },
  { text:"Il bat un record du club en nombre de passes réussies.", wageBonusPct:0.06 },
  { text:"Un documentaire lui est consacré, sa cote grimpe sur le marché.", ratingDelta:1, wageBonusPct:0.08 },
  { text:"Une saison studieuse, sans fait marquant particulier.", ratingDelta:0 }
];
function rollRandomEvent(){
  if(Math.random() >= 0.4) return null;
  return pick(RANDOM_EVENTS);
}

function simulateSeason(){
  const p = state.player;
  if(p.retired) return;

  // Progression de la note selon l'âge — plafond dur à 99, aucun plafond artificiel sous ce seuil
  let delta;
  if(p.age < 24) delta = randInt(1,5);
  else if(p.age < 29) delta = randInt(-1,3);
  else if(p.age < 33) delta = randInt(-3,1);
  else delta = randInt(-6,-1);

  // Événement aléatoire de la saison
  const event = rollRandomEvent();
  if(event && event.ratingDelta) delta += event.ratingDelta;

  p.rating = clamp(p.rating + delta, 40, 99);
  p.peakRating = Math.max(p.peakRating, p.rating);

  // Blessure
  const injured = Math.random() < 0.14;
  let apps = injured ? randInt(4,16) : randInt(18,38);
  apps = Math.round(apps * (0.7 + p.rating/200));
  apps = clamp(apps, 2, 40);

  let goals=0, assists=0, cleanSheets=0;
  if(p.position === "Attaquant"){
    goals = Math.round(apps * rand(0.35,0.75) * (p.rating/80));
    assists = Math.round(apps * rand(0.08,0.22));
  } else if(p.position === "Milieu"){
    goals = Math.round(apps * rand(0.08,0.28) * (p.rating/80));
    assists = Math.round(apps * rand(0.18,0.4) * (p.rating/80));
  } else if(p.position === "Défenseur"){
    goals = Math.round(apps * rand(0.01,0.09));
    assists = Math.round(apps * rand(0.04,0.14));
  } else { // Gardien
    cleanSheets = Math.round(apps * rand(0.2,0.5) * (p.rating/80));
  }

  // Championnat national (chance annuelle selon le standing du club)
  const leagueChance = [0,0.02,0.05,0.11,0.20,0.34][p.club.tier];
  const leagueWon = Math.random() < leagueChance;
  if(leagueWon) p.trophies.push(`Championnat national (${p.club.name}, ${p.age} ans)`);

  // Coupe nationale : disputée tous les 2 ans
  let cupWon = false;
  if(p.year % 2 === 0){
    const cupChance = [0,0.05,0.12,0.22,0.35,0.5][p.club.tier];
    cupWon = Math.random() < cupChance;
    if(cupWon) p.trophies.push(`Coupe nationale (${p.club.name}, ${p.age} ans)`);
  }

  // Trophée continental de clubs (réservé aux grosses écuries)
  let continentalWon = false;
  const contChance = [0,0,0,0.02,0.08,0.16][p.club.tier];
  if(Math.random() < contChance){
    continentalWon = true;
    p.trophies.push(`Trophée continental de clubs (${p.club.name}, ${p.age} ans)`);
  }
  const trophy = [leagueWon?"Championnat national":null, cupWon?"Coupe nationale":null, continentalWon?"Trophée continental":null].filter(Boolean).join(" + ") || null;

  // Salaire mis à jour selon la nouvelle note — le niveau du joueur pèse directement sur le salaire
  p.wage = computeWage(p.rating, p.club.tier, false);
  let earnings = p.wage;
  let eventBonus = 0;
  if(event && event.wageBonusPct){
    eventBonus = Math.round(p.wage * event.wageBonusPct);
    earnings += eventBonus;
  }
  p.totalEarnings += earnings;
  p.totalEventBonus += eventBonus;
  p.totalGoals += goals;
  p.totalAssists += assists;
  p.totalApps += apps;
  p.seasonsPlayed += 1;

  state.lastReport = {
    age:p.age, apps, goals, assists, cleanSheets, injured, trophy,
    rating:p.rating, wage:p.wage, event, eventBonus
  };

  // Équipe nationale
  state.lastReport.nt = simulateNationalTeamSeason(p);

  // Mercato : 0, 1 ou 2 offres possibles
  state.pendingOffers = generateOffers(p);

  render();
}

function generateOffers(p){
  const offers = [];
  const excluded = new Set([p.club.name]);
  const baseChance = clamp(0.32 + (p.rating-60)/200, 0.1, 0.7);
  // Jusqu'à 2 tirages indépendants, un club distinct par offre
  const rolls = [baseChance, baseChance*0.55];
  for(const chance of rolls){
    if(offers.length >= 2) break;
    if(Math.random() >= chance) continue;
    const fromOtherCountry = Math.random() < 0.35;
    const country = fromOtherCountry ? pick(COUNTRIES.filter(c=>c.name!==p.club.country)) : COUNTRIES.find(c=>c.name===p.club.country);
    const candidateClubs = country.clubs.filter(c=>!excluded.has(c.name));
    if(!candidateClubs.length) continue;
    const targetTierBias = clamp(Math.round(p.rating/20), 1, 5);
    const weighted = candidateClubs.map(c=>({c, w: 6 - Math.abs(c.tier - targetTierBias)}));
    const totalW = weighted.reduce((a,b)=>a+b.w,0);
    let r = rand(0,totalW), chosen = weighted[0].c;
    for(const item of weighted){ r -= item.w; if(r<=0){ chosen = item.c; break; } }

    const fee = computeTransferFee(p.rating, chosen.tier);
    const newWage = computeWage(p.rating, chosen.tier, false) * rand(1.05,1.3);
    offers.push({ club: chosen.name, country: country.name, tier: chosen.tier, fee, wage: Math.round(newWage) });
    excluded.add(chosen.name);
  }
  return offers;
}

function acceptOffer(idx){
  const p = state.player;
  const o = state.pendingOffers[idx];
  if(!o) return;
  p.totalTransferFees += o.fee;
  // clore l'entrée du club précédent
  const last = p.clubHistory[p.clubHistory.length-1];
  last.toAge = p.age;
  p.clubHistory.push({ club:o.club, country:o.country, fromAge:p.age, toAge:null });
  p.club = { name:o.club, tier:o.tier, country:o.country };
  p.wage = o.wage;
  state.news.unshift(`Transfert : ${p.name} rejoint ${o.club} (${flagOf(o.country)}${o.country}) pour ${euros(o.fee)}`);
  state.pendingOffers = [];
  render();
}
function declineOffers(){
  const offers = state.pendingOffers;
  if(offers.length) state.news.unshift(`${state.player.name} refuse le mercato et reste à ${state.player.club.name}`);
  state.pendingOffers = [];
  render();
}
function nextSeason(){
  const p = state.player;
  p.age += 1;
  p.year += 1;
  state.lastReport = null;
  if(p.age >= 43){
    retire();
    return;
  }
  render();
}
function retire(){
  const p = state.player;
  p.retired = true;
  p.playerRetireAge = p.age;
  const last = p.clubHistory[p.clubHistory.length-1];
  last.toAge = p.age;
  state.screen = "retire-choice";

function resetGame(){
  state = newState();
  render();
}

/* ============================= MODE ENTRAÎNEUR ============================= */
function computeCoachWage(coachRating, tier){
  const base = (Math.pow(coachRating,2)/100) * tier * 22000;
  return Math.round(base * rand(0.8,1.3));
}

function startCoachCareer(type){
  const p = state.player;
  const coachRating = clamp(Math.round(p.rating*0.5 + randInt(8,26)), 32, 68);
  let job;
  if(type === "national"){
    const nt = pick(NATIONAL_TEAMS);
    job = { kind:"national", name:nt.name, tier:nt.tier, continent:nt.continent, flag:nt.flag };
  } else {
    const country = COUNTRIES[randInt(0,COUNTRIES.length-1)];
    const targetTierBias = clamp(Math.round(coachRating/20), 1, 4);
    const weighted = country.clubs.map(c=>({c, w: 6 - Math.abs(c.tier - targetTierBias)}));
    const totalW = weighted.reduce((a,b)=>a+b.w,0);
    let r = rand(0,totalW), club = weighted[0].c;
    for(const item of weighted){ r -= item.w; if(r<=0){ club = item.c; break; } }
    job = { kind:"club", name:club.name, tier:club.tier, country:country.name };
  }
  const wage = computeCoachWage(coachRating, job.tier);
  p.coach = {
    rating: coachRating,
    age: p.age,
    job,
    wage,
    seasonsCoached:0,
    maxSeasons:15,
    wins:0, draws:0, losses:0,
    totalEarnings:0,
    trophies:[],
    jobHistory:[{ label: job.kind==="national" ? `Sélectionneur — ${job.flag} ${job.name}` : `${job.name} (${flagOf(job.country)}${job.country})`, fromAge:p.age, toAge:null }],
    lastReport:null,
    pendingOffers:[],
    retired:false
  };
  state.news.unshift(`${p.name} entame une carrière d'entraîneur${job.kind==="national" ? " comme sélectionneur de "+job.name : " à "+job.name}`);
  state.screen = "coach";
  render();
}

function simulateCoachSeason(){
  const p = state.player, c = p.coach;
  if(!c || c.retired) return;

  const isNational = c.job.kind === "national";
  const matches = isNational ? randInt(6,12) : randInt(30,38);
  const strengthScore = c.rating + c.job.tier*10;
  const winProb = clamp(0.24 + strengthScore/340, 0.15, 0.72);
  const drawProb = 0.24;
  const wins = Math.round(matches * winProb * rand(0.85,1.15));
  const draws = Math.round(matches * drawProb * rand(0.7,1.3));
  const losses = clamp(matches - wins - draws, 0, matches);

  c.wins += wins; c.draws += draws; c.losses += losses;
  c.seasonsCoached += 1;

  // Progression de la cote d'entraîneur selon les résultats
  const winRate = wins/matches;
  const ratingDelta = winRate > 0.55 ? randInt(1,4) : winRate < 0.3 ? randInt(-4,-1) : randInt(-1,2);
  c.rating = clamp(c.rating + ratingDelta, 30, 96);

  // Trophées de club (championnat annuel + coupe nationale biennale) ou faits marquants pour un sélectionneur
  let trophy = null;
  if(!isNational){
    const leagueChance = [0,0.02,0.05,0.11,0.20,0.34][c.job.tier];
    const leagueWon = Math.random() < leagueChance;
    if(leagueWon) c.trophies.push(`Championnat national (${c.job.name}, ${p.age} ans)`);
    let cupWon = false;
    if(p.year % 2 === 0){
      const cupChance = [0,0.05,0.12,0.22,0.35,0.5][c.job.tier];
      cupWon = Math.random() < cupChance;
      if(cupWon) c.trophies.push(`Coupe nationale (${c.job.name}, ${p.age} ans)`);
    }
    let contWon = false;
    if(Math.random() < [0,0,0,0.02,0.08,0.16][c.job.tier]){
      contWon = true;
      c.trophies.push(`Trophée continental de clubs (${c.job.name}, ${p.age} ans)`);
    }
    trophy = [leagueWon?"Championnat national":null, cupWon?"Coupe nationale":null, contWon?"Trophée continental":null].filter(Boolean).join(" + ") || null;
  } else if(Math.random() < 0.06){
    trophy = "Qualification historique";
    c.trophies.push(`${trophy} (${c.job.name}, ${p.age} ans)`);
  }

  // Tournoi international si sélectionneur
  let tournamentResult = null;
  if(isNational){
    const tournament = tournamentOfYear(p.year, c.job.continent);
    if(tournament){
      const strength = c.job.tier + (c.rating>=80?1.5:c.rating>=65?0.7:0);
      const result = simulateTournament(strength);
      tournamentResult = { name: tournament.name, round: result.round, champion: result.champion };
      if(result.champion) c.trophies.push(`${tournament.name} — Champion avec ${c.job.name} 🌍`);
    }
  }

  c.wage = computeCoachWage(c.rating, c.job.tier);
  c.totalEarnings += c.wage;

  // Risque de licenciement si saison catastrophique
  const sacked = winRate < 0.22 && Math.random() < 0.4;

  c.lastReport = { age:p.age, matches, wins, draws, losses, rating:c.rating, wage:c.wage, trophy, tournament: tournamentResult, sacked };

  c.pendingOffers = sacked ? generateCoachOffers(c, true) : generateCoachOffers(c, false);
  if(sacked){
    state.news.unshift(`${p.name} est démis de ses fonctions à ${c.job.name} après une saison catastrophique`);
  }
  render();
}

function generateCoachOffers(c, forced){
  const offers = [];
  const chance = forced ? 0.85 : clamp(0.25 + (c.rating-50)/200, 0.08, 0.55);
  const rolls = forced ? [1, chance*0.4] : [chance, chance*0.5];
  const excludedNames = new Set([c.job.name]);
  for(const roll of rolls){
    if(offers.length >= 2) break;
    if(Math.random() >= roll) continue;
    const wantNational = Math.random() < 0.25;
    if(wantNational){
      const candidates = NATIONAL_TEAMS.filter(n=>!excludedNames.has(n.name));
      if(!candidates.length) continue;
      const nt = pick(candidates);
      offers.push({ kind:"national", name:nt.name, tier:nt.tier, continent:nt.continent, flag:nt.flag, wage: computeCoachWage(c.rating, nt.tier) });
      excludedNames.add(nt.name);
    } else {
      const country = COUNTRIES[randInt(0,COUNTRIES.length-1)];
      const candidateClubs = country.clubs.filter(cl=>!excludedNames.has(cl.name));
      if(!candidateClubs.length) continue;
      const targetTierBias = clamp(Math.round(c.rating/20), 1, 5);
      const weighted = candidateClubs.map(cl=>({cl, w: 6 - Math.abs(cl.tier - targetTierBias)}));
      const totalW = weighted.reduce((a,b)=>a+b.w,0);
      let r = rand(0,totalW), chosen = weighted[0].cl;
      for(const item of weighted){ r -= item.w; if(r<=0){ chosen = item.cl; break; } }
      offers.push({ kind:"club", name:chosen.name, tier:chosen.tier, country:country.name, wage: computeCoachWage(c.rating, chosen.tier) });
      excludedNames.add(chosen.name);
    }
  }
  return offers;
}

function acceptCoachOffer(idx){
  const p = state.player, c = p.coach;
  const o = c.pendingOffers[idx];
  if(!o) return;
  const last = c.jobHistory[c.jobHistory.length-1];
  last.toAge = p.age;
  c.job = o.kind === "national"
    ? { kind:"national", name:o.name, tier:o.tier, continent:o.continent, flag:o.flag }
    : { kind:"club", name:o.name, tier:o.tier, country:o.country };
  c.wage = o.wage;
  c.jobHistory.push({ label: o.kind==="national" ? `Sélectionneur — ${o.flag} ${o.name}` : `${o.name} (${flagOf(o.country)}${o.country})`, fromAge:p.age, toAge:null });
  state.news.unshift(`${p.name} prend les commandes de ${o.name}${o.kind==="national" ? " en tant que sélectionneur" : ""}`);
  c.pendingOffers = [];
  render();
}
function declineCoachOffers(){
  const c = state.player.coach;
  if(c.pendingOffers.length) state.news.unshift(`${state.player.name} reste à ${c.job.name} malgré les sollicitations`);
  c.pendingOffers = [];
  render();
}
function nextCoachSeason(){
  const p = state.player, c = p.coach;
  p.age += 1;
  p.year += 1;
  c.lastReport = null;
  if(c.seasonsCoached >= c.maxSeasons || p.age >= 80){
    retireCoach();
    return;
  }
  render();
}
function retireCoach(){
  const p = state.player, c = p.coach;
  c.retired = true;
  const last = c.jobHistory[c.jobHistory.length-1];
  last.toAge = p.age;
  state.screen = "summary";
  render();
}

  else if(state.screen === "retire-choice") app.innerHTML = renderRetireChoice();

  else app.innerHTML = renderSummary();

  if(ticker) ticker.innerHTML = buildTickerText();
}

      <div class="sb-age">
        <div class="num">${p.age}</div>
        <div class="lbl">ans</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="v">${p.rating}</div><div class="l">Note globale</div>
        <div class="bar-outer"><div class="bar-inner" style="width:${potentialPct}%"></div></div>
      </div>
      <div class="stat-box"><div class="v">${p.totalGoals}</div><div class="l">Buts carrière</div></div>
      <div class="stat-box"><div class="v">${euros(p.wage).replace(' €','')}</div><div class="l">Salaire annuel (€)</div></div>
    </div>

    ${report ? `
      <div class="card report">
        <div class="eyebrow">Bilan de la saison — ${report.age} ans</div>
        <div class="report-line"><span class="k">Matchs joués</span><span class="v">${report.apps}${report.injured ? '<span class="tag tag-injury">Blessure</span>':''}</span></div>
        ${p.position !== 'Gardien' ? `
          <div class="report-line"><span class="k">Buts</span><span class="v">${report.goals}</span></div>
          <div class="report-line"><span class="k">Passes décisives</span><span class="v">${report.assists}</span></div>
        ` : `
          <div class="report-line"><span class="k">Clean sheets</span><span class="v">${report.cleanSheets}</span></div>
        `}
        <div class="report-line"><span class="k">Nouvelle note</span><span class="v">${report.rating}${report.trophy ? `<span class="tag tag-trophy">🏆 ${report.trophy}</span>`:''}</span></div>
        <div class="report-line"><span class="k">Nouveau salaire</span><span class="v">${euros(report.wage)}${report.eventBonus ? ` <span class="tag tag-trophy">+${euros(report.eventBonus)}</span>` : ''}</span></div>
        ${report.event ? `<div class="report-line"><span class="k">Événement de la saison</span><span class="v" style="font-weight:500;">${report.event.text}</span></div>` : ''}
      </div>

      <div class="card report">
        <div class="eyebrow">🌍 Équipe nationale — ${flagOf(p.country)}${p.country}</div>
        ${report.nt && report.nt.selected ? `
          <div class="report-line"><span class="k">Sélections cette saison</span><span class="v">${report.nt.caps}</span></div>
          <div class="report-line"><span class="k">Buts en sélection</span><span class="v">${report.nt.goals}</span></div>
          ${report.nt.tournament ? `
            <div class="report-line"><span class="k">${report.nt.tournament.name}</span><span class="v">${report.nt.tournament.champion ? '🏆 Champion' : report.nt.tournament.round}</span></div>
          ` : ""}
          <div class="report-line"><span class="k">Total sélections en carrière</span><span class="v">${p.nat.caps} caps · ${p.nat.goals} buts</span></div>
        ` : `<p class="muted">Pas de convocation en équipe nationale cette saison.</p>`}
      </div>
    ` : `
      <div class="card">
        <p class="muted">Prêt(e) pour une nouvelle saison à ${p.club.name} ? Les résultats — matchs, buts, blessures, salaire — seront générés aléatoirement selon ta forme et ton poste.</p>
      </div>
    `}

    ${report ? `
      <div class="eyebrow" style="margin-top:16px;">📰 Mercato — ${offers.length} offre${offers.length>1?'s':''} reçue${offers.length>1?'s':''}</div>
      ${offers.length ? offers.map((offer,idx)=>`
        <div class="offer-card">
          <div class="offer-club">${offer.club} ${stars(offer.tier)}</div>
          <div class="offer-detail"><span class="k">Pays</span><span>${flagOf(offer.country)}${offer.country}</span></div>
          <div class="offer-detail"><span class="k">Indemnité de transfert</span><span>${euros(offer.fee)}</span></div>
          <div class="offer-detail"><span class="k">Nouveau salaire annuel</span><span>${euros(offer.wage)}</span></div>
          <div class="btn-row">
            <button class="btn btn-gold btn-block" data-accept="${idx}">Accepter ce transfert</button>
          </div>
        </div>
      `).join("") : `<p class="muted">Aucun club ne s'est manifesté ce mercato. ${p.name} reste à ${p.club.name}.</p>`}
    ` : ""}

    <div class="btn-row">
      ${!report ? `<button class="btn btn-gold btn-block" id="play-season">▶ Jouer la saison</button>` : ""}
      ${report && offers.length ? `<button class="btn btn-ghost btn-block" id="decline-offers">Rester à ${p.club.name}</button>` : ""}
      ${report && !offers.length ? `<button class="btn btn-gold btn-block" id="next-season">Saison suivante →</button>` : ""}
    </div>
    ${!offers.length ? `
      <div class="btn-row">
        <button class="btn btn-red btn-block" id="retire-btn">Prendre sa retraite</button>
      </div>
    ` : ""}

    <div class="divider"></div>
    <p class="muted">Saisons jouées : ${p.seasonsPlayed} · Somme globale amassée : ${euros(computeGlobalSum(p))} · Potentiel estimé : ${p.potential}</p>

    <div class="ticker-wrap"><span class="badge">Transferts</span><div class="ticker-track" id="ticker-track"></div></div>
  `;
}

function buildTickerText(){
  if(!state.news.length) return `<span>Aucune actualité de transfert pour le moment…</span>`;
  return state.news.slice(0,10).map(n=>`<span>●</span> ${n}`).join("&nbsp;&nbsp;&nbsp;&nbsp;");
}

function renderRetireChoice(){
  const p = state.player;
  return `
    <div class="eyebrow">Fin de carrière de joueur</div>
    <h1 class="title-main">Et maintenant, <span>${p.name}</span> ?</h1>
    <p class="subtitle">Tu raccroches les crampons à ${p.age} ans. Tu peux rester dans le football en tant qu'entraîneur, ou consulter directement ton bilan.</p>
    <div class="card">
      <div class="btn-row" style="flex-direction:column;">
        <button class="btn btn-gold btn-block" id="become-club-coach">Devenir entraîneur de club</button>
        <button class="btn btn-gold btn-block" id="become-nt-coach">Devenir sélectionneur national</button>
        <button class="btn btn-ghost btn-block" id="skip-coaching">Voir mon bilan de carrière</button>
      </div>
    </div>
  `;
}

function renderCoach(){
  const p = state.player, c = p.coach;
  const report = c.lastReport;
  const offers = c.pendingOffers || [];
  const isNational = c.job.kind === "national";

  return `
    <div class="eyebrow">Carrière d'entraîneur · ${isNational ? "Sélectionneur" : "Club"}</div>
    <h1 class="title-main" style="font-size:32px;">${p.name}</h1>

    <div class="scoreboard" style="margin-top:14px;">
      <div>
        <div class="sb-club">${c.job.name}</div>
        <div class="sb-sub">${stars(c.job.tier)} · ${isNational ? (c.job.flag ? c.job.flag+' ' : '')+c.job.continent : flagOf(c.job.country)+c.job.country}</div>
      </div>
      <div class="sb-age">
        <div class="num">${p.age}</div>
        <div class="lbl">ans</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="v">${c.rating}</div><div class="l">Cote coach</div></div>
      <div class="stat-box"><div class="v">${c.wins}V-${c.draws}N-${c.losses}D</div><div class="l">Bilan carrière</div></div>
      <div class="stat-box"><div class="v">${euros(c.wage).replace(' €','')}</div><div class="l">Salaire annuel (€)</div></div>
    </div>

    ${report ? `
      <div class="card report">
        <div class="eyebrow">Bilan de la saison — ${report.age} ans</div>
        <div class="report-line"><span class="k">Matchs dirigés</span><span class="v">${report.matches}</span></div>
        <div class="report-line"><span class="k">Victoires / Nuls / Défaites</span><span class="v">${report.wins} / ${report.draws} / ${report.losses}</span></div>
        <div class="report-line"><span class="k">Nouvelle cote</span><span class="v">${report.rating}${report.trophy ? `<span class="tag tag-trophy">🏆 ${report.trophy}</span>`:''}</span></div>
        ${report.tournament ? `<div class="report-line"><span class="k">${report.tournament.name}</span><span class="v">${report.tournament.champion ? '🏆 Champion' : report.tournament.round}</span></div>` : ""}
        <div class="report-line"><span class="k">Nouveau salaire</span><span class="v">${euros(report.wage)}</span></div>
        ${report.sacked ? `<div class="report-line"><span class="k">Statut</span><span class="v"><span class="tag tag-injury">Licencié</span></span></div>` : ""}
      </div>
    ` : `
      <div class="card">
        <p class="muted">Prêt(e) pour une nouvelle saison sur le banc ${isNational ? "de " + c.job.name : "de " + c.job.name} ?</p>
      </div>
    `}

    ${report ? `
      <div class="eyebrow" style="margin-top:16px;">📰 ${report.sacked ? "Recherche d'un nouveau banc" : "Sollicitations"} — ${offers.length} offre${offers.length>1?'s':''}</div>
      ${offers.length ? offers.map((offer,idx)=>`
        <div class="offer-card">
          <div class="offer-club">${offer.kind==="national" ? offer.flag+' ' : ''}${offer.name} ${stars(offer.tier)} ${offer.kind==="national" ? "· Sélection nationale" : ""}</div>
          <div class="offer-detail"><span class="k">${offer.kind==="national" ? "Confédération" : "Pays"}</span><span>${offer.kind==="national" ? offer.continent : flagOf(offer.country)+offer.country}</span></div>
          <div class="offer-detail"><span class="k">Salaire annuel proposé</span><span>${euros(offer.wage)}</span></div>
          <div class="btn-row">
            <button class="btn btn-gold btn-block" data-coach-accept="${idx}">Accepter ce poste</button>
          </div>
        </div>
      `).join("") : `<p class="muted">${report.sacked ? "Aucune proposition pour l'instant." : "Aucun club ou fédération ne s'est manifesté."}</p>`}
    ` : ""}

    <div class="btn-row">
      ${!report ? `<button class="btn btn-gold btn-block" id="play-coach-season">▶ Diriger la saison</button>` : ""}
      ${report && offers.length && !report.sacked ? `<button class="btn btn-ghost btn-block" id="decline-coach-offers">Rester à ${c.job.name}</button>` : ""}
      ${report && !offers.length && !report.sacked ? `<button class="btn btn-gold btn-block" id="next-coach-season">Saison suivante →</button>` : ""}
      ${report && offers.length && report.sacked ? `<p class="muted">Choisis un nouveau banc pour continuer.</p>` : ""}
    </div>
    ${!offers.length ? `
      <div class="btn-row">
        <button class="btn btn-red btn-block" id="retire-coach-btn">Prendre sa retraite d'entraîneur</button>
      </div>
    ` : ""}

    <div class="divider"></div>
    <p class="muted">Saisons dirigées : ${c.seasonsCoached} / ${c.maxSeasons} · Gains cumulés (coaching) : ${euros(c.totalEarnings)}</p>

    <div class="ticker-wrap"><span class="badge">Carrière coach</span><div class="ticker-track" id="ticker-track"></div></div>
  `;
}

function renderSummary(){
  const p = state.player;
  const c = p.coach;
  return `
    <div class="eyebrow">Fin de carrière</div>
    <h1 class="title-main">Merci, <span>${p.name}</span> !</h1>
    <div class="card">
      <div class="final-hero">
        <div class="num">${euros(computeGlobalSum(p))}</div>
        <div class="muted">Somme globale amassée sur toute la carrière (salaires + transferts + coaching)</div>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="v">${p.seasonsPlayed}</div><div class="l">Saisons pro</div></div>
        <div class="stat-box"><div class="v">${p.totalGoals}</div><div class="l">Buts</div></div>
        <div class="stat-box"><div class="v">${p.totalApps}</div><div class="l">Matchs joués</div></div>
      </div>
      <div class="divider"></div>
      <div class="report-line"><span class="k">Carrière joueur</span><span class="v">de ${p.startAge} à ${p.playerRetireAge || p.age} ans</span></div>
      <div class="report-line"><span class="k">Meilleure note obtenue</span><span class="v">${p.peakRating}</span></div>
      <div class="report-line"><span class="k">Note en fin de carrière</span><span class="v">${p.rating}</span></div>
      <div class="report-line"><span class="k">Passes décisives</span><span class="v">${p.totalAssists}</span></div>
      <div class="report-line"><span class="k">Sélections nationales</span><span class="v">${p.nat.caps} caps · ${p.nat.goals} buts</span></div>
      <div class="report-line"><span class="k">Salaires cumulés (joueur)</span><span class="v">${euros(p.totalEarnings)}</span></div>
      <div class="report-line"><span class="k">Dont primes d'événements aléatoires</span><span class="v">${euros(p.totalEventBonus||0)}</span></div>
      <div class="report-line"><span class="k">Valeur totale des transferts</span><span class="v">${euros(p.totalTransferFees)}</span></div>

      <div class="divider"></div>
      <div class="eyebrow">Palmarès joueur (${p.trophies.length})</div>
      <div class="trophy-list">
        ${p.trophies.length ? p.trophies.map(t=>`<div class="trophy-chip">🏆 ${t}</div>`).join("") : `<p class="muted">Aucun trophée remporté cette carrière.</p>`}
      </div>

      <div class="divider"></div>
      <div class="eyebrow">Clubs traversés</div>
      <div class="club-history">
        ${p.clubHistory.map(cl=>`
          <div class="row"><span>${cl.club} (${flagOf(cl.country)}${cl.country})</span><span class="muted">${cl.fromAge} → ${cl.toAge} ans</span></div>
        `).join("")}
      </div>

      ${c ? `
        <div class="divider"></div>
        <div class="eyebrow">Carrière d'entraîneur</div>
        <div class="report-line"><span class="k">Saisons dirigées</span><span class="v">${c.seasonsCoached}</span></div>
        <div class="report-line"><span class="k">Bilan (V-N-D)</span><span class="v">${c.wins}-${c.draws}-${c.losses}</span></div>
        <div class="report-line"><span class="k">Cote finale d'entraîneur</span><span class="v">${c.rating}</span></div>
        <div class="report-line"><span class="k">Gains cumulés (coaching)</span><span class="v">${euros(c.totalEarnings)}</span></div>
        <div class="trophy-list" style="margin-top:10px;">
          ${c.trophies.length ? c.trophies.map(t=>`<div class="trophy-chip">🏆 ${t}</div>`).join("") : `<p class="muted">Aucun trophée en tant qu'entraîneur.</p>`}
        </div>
        <div class="club-history">
          ${c.jobHistory.map(j=>`
            <div class="row"><span>${j.label}</span><span class="muted">${j.fromAge} → ${j.toAge} ans</span></div>
          `).join("")}
        </div>
      ` : ""}
    </div>
    <div class="btn-row">
      <button class="btn btn-gold btn-block" id="restart-btn">Commencer une nouvelle carrière</button>
    </div>
  `;
}

/* ============================= HANDLERS ============================= */
function attachHandlers(){
  document.querySelectorAll("[data-country]").forEach(btn=>{
    btn.onclick = ()=>{ state.countryIdx = parseInt(btn.dataset.country); render(); };
  });
  document.querySelectorAll("[data-pos]").forEach(btn=>{
    btn.onclick = ()=>{ state.posIdx = parseInt(btn.dataset.pos); render(); };
  });
  const nameInput = document.getElementById("player-name");
  if(nameInput) nameInput.oninput = (e)=>{ state.name = e.target.value; };

  const toStep2 = document.getElementById("to-step2");
  if(toStep2) toStep2.onclick = ()=>{ state.step=2; render(); };
  const backStep1 = document.getElementById("back-step1");
  if(backStep1) backStep1.onclick = ()=>{ state.step=1; render(); };
  const toLaunch = document.getElementById("to-launch");
  if(toLaunch) toLaunch.onclick = startCareer;

  const playSeason = document.getElementById("play-season");
  if(playSeason) playSeason.onclick = simulateSeason;
  const nextSeasonBtn = document.getElementById("next-season");
  if(nextSeasonBtn) nextSeasonBtn.onclick = nextSeason;
  const retireBtn = document.getElementById("retire-btn");
  if(retireBtn) retireBtn.onclick = retire;

  document.querySelectorAll("[data-accept]").forEach(btn=>{
    btn.onclick = ()=> acceptOffer(parseInt(btn.dataset.accept));
  });
  const declineBtn = document.getElementById("decline-offers");
  if(declineBtn) declineBtn.onclick = declineOffers;

  const ageInput = document.getElementById("player-age");
  if(ageInput){
    ageInput.oninput = (e)=>{
      state.ageChoice = parseInt(e.target.value);
      const label = document.getElementById("age-value");
      if(label) label.textContent = state.ageChoice;
    };
  }

  const restartBtn = document.getElementById("restart-btn");
  if(restartBtn) restartBtn.onclick = resetGame;

  const becomeClubCoach = document.getElementById("become-club-coach");
  if(becomeClubCoach) becomeClubCoach.onclick = ()=> startCoachCareer("club");
  const becomeNtCoach = document.getElementById("become-nt-coach");
  if(becomeNtCoach) becomeNtCoach.onclick = ()=> startCoachCareer("national");
  const skipCoaching = document.getElementById("skip-coaching");
  if(skipCoaching) skipCoaching.onclick = ()=>{ state.screen = "summary"; render(); };

  const playCoachSeason = document.getElementById("play-coach-season");
  if(playCoachSeason) playCoachSeason.onclick = simulateCoachSeason;
  const nextCoachSeasonBtn = document.getElementById("next-coach-season");
  if(nextCoachSeasonBtn) nextCoachSeasonBtn.onclick = nextCoachSeason;
  const retireCoachBtn = document.getElementById("retire-coach-btn");
  if(retireCoachBtn) retireCoachBtn.onclick = retireCoach;
  document.querySelectorAll("[data-coach-accept]").forEach(btn=>{
    btn.onclick = ()=> acceptCoachOffer(parseInt(btn.dataset.coachAccept));
  });
  const declineCoachBtn = document.getElementById("decline-coach-offers");
  if(declineCoachBtn) declineCoachBtn.onclick = declineCoachOffers;
}

render();
</script>
</body>
</html>
